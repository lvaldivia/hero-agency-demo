# Misión 4 del demo "Examen de Licencia de Héroe"
# Build + tests + deploy a la Container App de staging con smoke test.

trigger:
  branches:
    include:
      - main

variables:
  azureSubscription: 'sc-hero-agency'               # service connection Azure Resource Manager
  dockerRegistryServiceConnection: 'sc-hero-agency-acr'  # service connection Docker Registry (ACR)
  containerRegistry: 'acrheroagencyluis.azurecr.io'
  imageRepository: 'hero-agency'
  tag: '$(Build.BuildId)'
  containerAppName: 'hero-agency-luis'              # Container App de producción
  stagingAppName: 'hero-agency-luis-staging'        # Container App de staging
  resourceGroup: 'rg-hero-agency'
  stagingUrl: 'https://hero-agency-luis-staging.thankfulsea-0a741749.eastus2.azurecontainerapps.io'
  prodUrl: 'https://hero-agency-luis.thankfulsea-0a741749.eastus2.azurecontainerapps.io'
  nodeVersion: '22.x'

stages:
# ── Misión 1 y 2: Despertar del Quirk + El brazo roto ──────────────────
- stage: Build
  displayName: 'Build y Test'
  jobs:
  - job: BuildJob
    displayName: 'Construir y probar'
    pool:
      name: 'Default'          # agente self-hosted (laptop). Plan B: vmImage: 'ubuntu-latest'
    steps:
    - task: NodeTool@0
      displayName: 'Instalar Node.js'
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: npm ci
      displayName: 'Instalar dependencias'

    - script: npm run test:ci
      displayName: 'Ejecutar tests'

    - task: PublishTestResults@2
      displayName: 'Publicar resultados del examen'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results.xml'
        testRunTitle: 'Examen de Licencia'

    - task: Docker@2
      displayName: 'Construir y publicar imagen Docker'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        Dockerfile: 'Dockerfile'
        tags: |
          $(tag)
          latest

# ── Misión 4: Primera patrulla en staging ──────────────────────────────
- stage: Staging
  displayName: 'Deploy a Staging'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployStaging
    displayName: 'Desplegar a staging'
    environment: 'staging'
    pool:
      name: 'Default'          # agente self-hosted (laptop). Plan B: vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none

          - task: AzureContainerApps@1
            displayName: 'Desplegar en Container Apps (staging)'
            inputs:
              azureSubscription: '$(azureSubscription)'
              containerAppName: '$(stagingAppName)'
              resourceGroup: '$(resourceGroup)'
              imageToDeploy: '$(containerRegistry)/$(imageRepository):$(tag)'

          - script: |
              for i in $(seq 1 12); do
                if curl -fsS "$(stagingUrl)/health"; then
                  echo ""; echo "Smoke test OK en staging"; exit 0
                fi
                echo "Intento $i: aún no responde, reintentando en 10s..."
                sleep 10
              done
              echo "##vso[task.logissue type=error]Staging no respondió al /health"
              exit 1
            displayName: 'Smoke test: ¡Ya estoy aquí!'
